<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Featurewise diagrams</title>
  <style>
    :root { --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #f5f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    aside { padding: 16px; overflow-y: auto; border-right: 1px solid var(--line); background: #fff; }
    main { padding: 16px; overflow: auto; display: flex; align-items: center; justify-content: center; }
    #view { background: #fff; border: 1px solid var(--line); max-width: 100%; max-height: 100%; }
    #view svg { display: block; max-width: 100%; max-height: calc(100vh - 34px); height: auto; width: auto; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 6px; }
    .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
    button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background: var(--bg); }
    input[type=number] { width: 80px; font: inherit; padding: 4px; }
    label.weight { display: grid; grid-template-columns: 1fr 44px; gap: 2px 8px; font-size: 13px; margin: 6px 0; }
    label.weight input { grid-column: 1 / 3; width: 100%; }
    label.weight span.value { text-align: right; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 2px 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    #progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 8px 0; }
    #progress div { height: 100%; background: #0071e3; width: 0; }
    .stat { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <aside>
    <h1 id="service">Featurewise diagrams</h1>
    <div class="row">
      <label>Seed <input id="seed" type="number" value="1"></label>
      <button id="random">Random</button>
    </div>
    <div class="row">
      <label>Steps <input id="steps" type="number" value="120000" step="10000"></label>
    </div>
    <div class="row">
      <button id="restart">Start again</button>
      <button id="pause">Pause</button>
      <button id="download">Download SVG</button>
    </div>
    <div class="row">
      <label><input id="key" type="checkbox" checked> Key</label>
      <label>Margin <input id="margin" type="number" value="2.5" min="0" step="0.5" style="width: 4em"></label>
      <label><input id="brand" type="checkbox"> Brand colours</label>
    </div>
    <div class="row">
      <label>Speed <input id="speed" type="range" min="1" max="2000" value="300"></label>
    </div>
    <div id="progress"><div></div></div>
    <div class="stat" id="stats"></div>
    <h2>Score (lower is better)</h2>
    <table id="terms"></table>
    <h2>Weights</h2>
    <div id="weights"></div>
  </aside>
  <main><div id="view"></div></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
